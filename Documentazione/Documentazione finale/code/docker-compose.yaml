services:
  # 1. DATABASE POSTGRESQL 15
  postgresql:
    image: postgres:15-alpine
    container_name: bugboard_postgres
    environment:
      POSTGRES_DB: bugboard_db
      POSTGRES_USER: postgres      # Utente master admin temporaneo
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bugboard_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bugboard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. AUTH SERVICE
  auth-service:
    build:
      context: ./back-end/auth-service 
      dockerfile: Dockerfile
    container_name: bugboard_auth_service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/bugboard_db?currentSchema=bugboard
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - bugboard_network
    restart: on-failure

networks:
  bugboard_network:
    driver: bridge

volumes:
  pgdata:
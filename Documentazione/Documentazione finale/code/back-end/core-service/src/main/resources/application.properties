# =============================================================================
# CONFIGURAZIONE GENERALE APPLICAZIONE
# =============================================================================
spring.application.name=core-service
server.port=8080

# =============================================================================
# CONFIGURAZIONE DATABASE
# =============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/bugboard_db?currentSchema=bugboard
spring.datasource.username=core_service_user
spring.datasource.password=core_sec_pwd

# =============================================================================
# CONFIGURAZIONE HIBERNATE
# =============================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=bugboard

# =============================================================================
# CONFIGURAZIONE UPLOAD ALLEGATI
# =============================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.storage.upload-dir=./core_uploads

# =============================================================================
# CONFIGURAZIONE SICUREZZA E JWT
# =============================================================================
jwt.secret=BugBoard26SecretKeyForJwtSigningMustBeAtLeast256BitsLongForHMACSHA256Algorithm
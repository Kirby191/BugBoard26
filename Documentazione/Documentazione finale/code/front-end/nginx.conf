server {
    listen 80;
    server_name localhost;

    # Percorso dove si trovano i file compilati di Angular
    root /usr/share/nginx/html;
    index index.html;

    # Gestione delle rotte Angular SPA: reindirizza tutto a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy per l'Auth Service (Porta 8081)
    location /api/auth/ {
        proxy_pass http://auth-service:8081/api/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse Proxy per il Core Service (Porta 8080)
    location /api/ {
        proxy_pass http://core-service:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
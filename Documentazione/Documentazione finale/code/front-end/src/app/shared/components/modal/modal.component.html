     APP / SHARED / COMPONENTS / MODAL / MODAL
     -------------------------------------------------
 -->

@if (isOpen()) {
  <!-- Il backdrop chiude il modal; il contenuto interrompe il click per non propagare l'evento. -->
  <div class="modal-backdrop" (click)="onCancel()">
    
    
    <div class="modal-content" (click)="stopPropagation($event)">
      
      
      <div class="modal-header">
        <h3 class="modal-title">{{ title() }}</h3>
        <button class="btn-close" aria-label="Chiudi" (click)="onCancel()">&times;</button>
      </div>

      <!-- Il contenuto proiettato permette ai chiamanti di inserire messaggi più ricchi. -->
      <div class="modal-body">
        @if (message()) {
          <p>{{ message() }}</p>
        }
        
        <ng-content></ng-content>
      </div>

      
      <div class="modal-footer">
        
        
        @if (cancelText()) {
          <button class="btn btn-secondary" (click)="onCancel()">
            {{ cancelText() }}
          </button>
        }

        
        @if (confirmText()) {
          <button class="btn btn-{{ type() }}" (click)="onConfirm()">
            {{ confirmText() }}
          </button>
        }
        
      </div>

    </div>
  </div>
}

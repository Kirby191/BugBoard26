<!-- --------------------------------------------------------------
     APP / ISSUE / COMPONENTS / PROJECT FORM / PROJECT FORM
     --------------------------------------------------------------
 -->

<div class="form-container card">
  <div class="card-header">
    <h2>{{ isEditMode() ? 'Modifica Progetto' : 'Nuovo Progetto' }}</h2>
  </div>
  <div class="card-body">
    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Nome Progetto</label>
        <input id="name" type="text" formControlName="name" class="form-control" maxlength="150" />
      </div>

      <div class="form-group">
        <label for="description">Descrizione (Opzionale)</label>
        <textarea id="description" formControlName="description" class="form-control" rows="4"></textarea>
        
        
        @if (showCharCounter) {
          <div class="char-counter" 
               [ngClass]="{'text-danger': remainingChars < 0}"
               [title]="remainingChars < 0 ? 'Il messaggio è troppo lungo' : (remainingChars > 0 ? remainingChars + ' caratteri rimasti' : 'Limite massimo raggiunto')">
            {{ remainingChars }}
          </div>
        }
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="navigateBack()">Annulla</button>
        <button type="submit" class="btn btn-primary" [disabled]="projectForm.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Salvataggio...' : 'Salva' }}
        </button>
      </div>
    </form>
  </div>
</div>




<!-- ============================================================
  MODALI / USCITA DALLA FORM
  ============================================================
  Avvisa l'utente prima di scartare modifiche non salvate.
  ============================================================ -->
<app-modal 
  [(isOpen)]="isModalOpen" 
  title="Attenzione: Dati non salvati" 
  message="Hai effettuato delle modifiche al progetto. Se esci ora, andranno perse. Vuoi annullare?" 
  type="warning"
  confirmText="Sì, esci"
  cancelText="Rimani qui"
  (confirm)="forceNavigateBack()">
</app-modal>



 
<!-- ============================================================
  MODALI / VALIDAZIONE DESCRIZIONE
  ============================================================
  Informa l'utente quando il testo supera il limite previsto.
  ============================================================ -->
<app-modal 
  [(isOpen)]="isLimitModalOpen" 
  title="Limite Superato" 
  message="La descrizione ha superato il limite massimo di 800 caratteri. Riduci il testo per poter continuare e salvare il progetto." 
  type="info"
  confirmText="Ho capito">
</app-modal>

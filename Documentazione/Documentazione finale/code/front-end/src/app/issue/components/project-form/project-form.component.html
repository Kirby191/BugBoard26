<div class="form-container card">
  <div class="card-header">
    <h2>{{ isEditMode() ? 'Modifica Progetto' : 'Nuovo Progetto' }}</h2>
  </div>
  <div class="card-body">
    @if (errorMessage()) {
      <div class="alert alert-danger">{{ errorMessage() }}</div>
    }

    <form [formGroup]="projectForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Nome Progetto *</label>
        <input id="name" type="text" formControlName="name" class="form-control" maxlength="150" />
      </div>

      <div class="form-group">
        <label for="description">Descrizione</label>
        <textarea id="description" formControlName="description" class="form-control" rows="4"></textarea>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="navigateBack()">Annulla</button>
        <button type="submit" class="btn btn-primary" [disabled]="projectForm.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Salvataggio...' : 'Salva' }}
        </button>
      </div>
    </form>
  </div>
</div>

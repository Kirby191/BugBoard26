<!-- Navbar condivisa -->
<!-- Il componente è 'dumb': riceve lo stato e notifica l'azione -->
<app-navbar 
  [isLoggedIn]="authService.isLoggedIn()" 
  (logoutAction)="handleLogout()">
  
  <!-- La campanellina viene iniettata dinamicamente nello slot <ng-content> della navbar -->
  <app-notification-list></app-notification-list>

</app-navbar>

<!-- Container principale dove il router inietterà dinamicamente le viste -->
<main class="app-content" style="padding: 20px;">
  <router-outlet />
</main>

<div class="login-container">
  <h1>Login</h1>

  @if (errorMessage()) {
    <div class="error-banner">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="loginForm" (ngSubmit)="login()">
    
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Inserisci email" />
      <!-- Messaggio locale personalizzato -->
      @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
        <small class="error-text">Si prega di inserire l'email.</small>
      }
    </div>

    <div class="form-group" style="margin-bottom: 25px;">
      <label for="password">Password</label>
      
      <!-- Wrapper per posizionare l'occhio -->
      <div class="password-wrapper">
        <!-- Binding dinamico del type basato sul signal -->
        <input id="password" [type]="isPasswordVisible() ? 'text' : 'password'" formControlName="password" placeholder="Inserisci password" />
        
        <!-- Icona cliccabile dell'occhio -->
       <span class="toggle-eye" (click)="togglePasswordVisibility()" title="Mostra/Nascondi password">
          @if (!isPasswordVisible()) {
            <!-- Occhio sbarrato (Password Nascosta) -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          } @else {
            <!-- Occhio aperto (Password Visibile) -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          }
        </span>
      </div>
    </div>

    <!-- Bottone di Login -->
    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Accesso in corso...' : 'Log in ➔' }}
    </button>
  </form>
</div>

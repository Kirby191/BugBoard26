<div class="login-container">
  <h1>Login</h1>

  @if (errorMessage()) {
    <div class="error-banner">
      {{ errorMessage() }}
    </div>
  }

  <form [formGroup]="loginForm" (ngSubmit)="login()">
    
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="Inserisci email" />
      <!-- Messaggio locale personalizzato -->
      @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
        <small class="error-text">Si prega di inserire l'email.</small>
      }
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" placeholder="Inserisci password" />
      <!-- Messaggio locale personalizzato -->
      @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
        <small class="error-text">Si prega di inserire la password.</small>
      }
    </div>

    <!-- Bottone dinamico che cambia testo e si disabilita per evitare doppi click -->
    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Accesso in corso...' : 'Accedi' }}
    </button>
  </form>
</div>
